name: Build RenessPOS Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and Package with Maven
        run: mvn clean package -DskipTests

      - name: Prepare App Folder and Bundled Java Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/App"
          
          # Find and copy the compiled jar and rename it to renesspos.jar
          $jarFile = Get-ChildItem -Path "target" -Filter "*.jar" | Where-Object { $_.Name -notmatch "sources|doc" } | Select-Object -First 1
          if ($jarFile) {
              Copy-Item -Path $jarFile.FullName -Destination "dist/App/renesspos.jar"
          } else {
              Write-Error "Could not find the compiled JAR file in the target folder."
              exit 1
          }

          if (Test-Path "target/lib") { Copy-Item -Path "target/lib" -Destination "dist/App/lib" -Recurse }
          if (Test-Path "target/plugins") { Copy-Item -Path "target/plugins" -Destination "dist/App/plugins" -Recurse }
          if (Test-Path "config") { Copy-Item -Path "config" -Destination "dist/App/config" -Recurse }
          if (Test-Path "derby-db") { Copy-Item -Path "derby-db" -Destination "dist/App/derby-db" -Recurse }

          # Download portable Java 8 runtime (JRE)
          Write-Host "Downloading portable JRE..."
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile "jre.zip"
          Expand-Archive -Path "jre.zip" -DestinationPath "dist/jre_temp"
          $jreFolder = Get-ChildItem -Path "dist/jre_temp" | Select-Object -First 1
          Move-Item -Path $jreFolder.FullName -Destination "dist/App/jre"

      - name: Create Windows Installer with Inno Setup
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=RenessPOS
          AppVersion=1.0.0
          DefaultDirName={autopf}\RenessPOS
          DefaultGroupName=RenessPOS
          OutputDir=installer_out
          OutputBaseFilename=RenessPOS_Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "dist\App\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Dirs]
          Name: "{app}"; Permissions: users-modify

          [Icons]
          Name: "{group}\RenessPOS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"
          Name: "{autodesktop}\RenessPOS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Description: "Launch RenessPOS"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath "setup.iss" -Encoding utf8

          iscc "setup.iss"

      - name: Upload Finished Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenessPOS-Windows-Installer
          path: installer_out/RenessPOS_Setup.exe
