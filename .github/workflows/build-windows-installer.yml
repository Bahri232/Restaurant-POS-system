name: Build Windows Installer

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-installer:
    name: Build Standalone Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 8 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Maven Build (Clean and Package)
        shell: pwsh
        run: |
          if (Test-Path "settings.xml") {
            mvn clean package -DskipTests -B -s settings.xml
          } else {
            mvn clean package -DskipTests -B
          }

      - name: Distribution and JRE Packaging
        shell: pwsh
        run: |
          Write-Host "Creating packaging directories..."
          New-Item -ItemType Directory -Force -Path "dist/App" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/Installer" | Out-Null

          Write-Host "Locating compiled application JAR in target/..."
          $appJar = Get-ChildItem -Path "target" -Filter "*.jar" | Where-Object { $_.Name -notmatch "original|sources|javadoc" } | Select-Object -First 1
          if (-not $appJar) {
              Write-Error "Could not find compiled application JAR in target/ folder."
              exit 1
          }
          Write-Host "Found compiled JAR: $($appJar.FullName)"
          Write-Host "Renaming and moving to dist/App/renesspos.jar..."
          Copy-Item -Path $appJar.FullName -Destination "dist/App/renesspos.jar" -Force

          # Copy necessary resource directories if they exist in repository
          $dirsToCopy = @("lib", "plugins", "config", "derby-db", "database", "i18n")
          foreach ($dir in $dirsToCopy) {
              if (Test-Path $dir) {
                  Write-Host "Copying repository directory $dir to dist/App/$dir..."
                  Copy-Item -Path $dir -Destination "dist/App/$dir" -Recurse -Force
              }
          }

          # Fallback: check target build directory for assembly outputs if repository folders were empty or generated
          if (-not (Test-Path "dist/App/lib")) {
              if (Test-Path "target/floreantpos-bin/floreantpos/lib") {
                  Write-Host "Copying lib/ from target assembly..."
                  Copy-Item -Path "target/floreantpos-bin/floreantpos/lib" -Destination "dist/App/lib" -Recurse -Force
              } elseif (Test-Path "target/lib") {
                  Write-Host "Copying lib/ from target/lib..."
                  Copy-Item -Path "target/lib" -Destination "dist/App/lib" -Recurse -Force
              }
          }
          if (-not (Test-Path "dist/App/plugins") -and (Test-Path "target/floreantpos-bin/floreantpos/plugins")) {
              Write-Host "Copying plugins/ from target assembly..."
              Copy-Item -Path "target/floreantpos-bin/floreantpos/plugins" -Destination "dist/App/plugins" -Recurse -Force
          }
          if (Test-Path "target/floreantpos-bin/floreantpos/config") {
              Write-Host "Merging config files from target assembly..."
              if (-not (Test-Path "dist/App/config")) {
                  New-Item -ItemType Directory -Force -Path "dist/App/config" | Out-Null
              }
              Copy-Item -Path "target/floreantpos-bin/floreantpos/config/*" -Destination "dist/App/config/" -Recurse -Force
          }
          if (-not (Test-Path "dist/App/database") -and (Test-Path "target/floreantpos-bin/floreantpos/database")) {
              Write-Host "Copying database/ from target assembly..."
              Copy-Item -Path "target/floreantpos-bin/floreantpos/database" -Destination "dist/App/database" -Recurse -Force
          }

          # Remove duplicate floreantpos jar inside lib if present
          if (Test-Path "dist/App/lib") {
              Get-ChildItem -Path "dist/App/lib" -Filter "*floreantpos*.jar" -ErrorAction SilentlyContinue | Remove-Item -Force
          }

          # Copy root properties and icon if present
          Get-ChildItem -Path "." -Filter "*.properties" -File | ForEach-Object {
              Copy-Item $_.FullName "dist/App/" -Force
          }
          if (Test-Path "resources/icons/icon.ico") {
              Copy-Item "resources/icons/icon.ico" "dist/App/icon.ico" -Force
          } elseif (Test-Path "images/icon.ico") {
              Copy-Item "images/icon.ico" "dist/App/icon.ico" -Force
          }

          # Download portable Adoptium Temurin OpenJDK 8 JRE for Windows x64
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse"
          Write-Host "Downloading portable Adoptium Temurin OpenJDK 8 JRE (Windows x64)..."
          curl.exe -L -f -s -S --retry 3 -o jre.zip $jreUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "jre.zip")) {
              Write-Error "Failed to download JRE from $jreUrl"
              exit 1
          }

          Write-Host "Extracting portable JRE into dist/App/jre..."
          Expand-Archive -Path "jre.zip" -DestinationPath "dist/jre_temp" -Force
          $extractedJre = Get-ChildItem -Directory -Path "dist/jre_temp" | Select-Object -First 1
          if (-not $extractedJre) {
              Write-Error "Could not locate extracted JRE directory"
              exit 1
          }
          Move-Item -Path $extractedJre.FullName -Destination "dist/App/jre" -Force
          Remove-Item -Recurse -Force "dist/jre_temp", "jre.zip"

          if (-not (Test-Path "dist/App/jre/bin/javaw.exe")) {
              Write-Error "javaw.exe not found at dist/App/jre/bin/javaw.exe"
              exit 1
          }
          Write-Host "Portable JRE successfully installed at dist/App/jre"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Inno Setup via Chocolatey..."
              choco install innosetup -y --no-progress
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Generate Inno Setup Script (setup.iss)
        shell: pwsh
        run: |
          $hasIcon = Test-Path "dist/App/icon.ico"
          $setupIconLine = if ($hasIcon) { 'SetupIconFile=dist\App\icon.ico' } else { '' }
          $iconParam = if ($hasIcon) { '; IconFilename: "{app}\icon.ico"' } else { '' }

          $lines = @(
              '[Setup]',
              'AppName=RenessPOS',
              'AppVersion=1.0.0',
              'DefaultDirName={autopf}\RenessPOS',
              'DefaultGroupName=RenessPOS',
              'OutputDir=dist\Installer',
              'OutputBaseFilename=RenessPOS_Setup',
              'Compression=lzma2/ultra64',
              'SolidCompression=yes',
              'ArchitecturesInstallIn64BitMode=x64',
              'DisableProgramGroupPage=yes',
              'PrivilegesRequired=admin'
          )

          if ($setupIconLine) {
              $lines += $setupIconLine
          }

          $lines += @(
              '',
              '[Languages]',
              'Name: "english"; MessagesFile: "compiler:Default.isl"',
              '',
              '[Tasks]',
              'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
              '',
              '[Files]',
              'Source: "dist\App\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs',
              '',
              '[Dirs]',
              'Name: "{app}"; Permissions: users-modify',
              '',
              '[Icons]',
              ('Name: "{group}\RenessPOS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"' + $iconParam),
              ('Name: "{autodesktop}\RenessPOS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Tasks: desktopicon' + $iconParam),
              '',
              '[Run]',
              'Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,RenessPOS}"; Flags: nowait postinstall skipifsilent'
          )

          $lines | Out-File -FilePath "setup.iss" -Encoding utf8
          Write-Host "Generated setup.iss content:"
          Get-Content -Path "setup.iss"

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
              "iscc.exe"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
              Write-Error "Inno Setup Compiler (ISCC.exe) not found"
              exit 1
          }
          Write-Host "Compiling setup.iss using $iscc..."
          & $iscc setup.iss

          if (-not (Test-Path "dist/Installer/RenessPOS_Setup.exe")) {
              Write-Error "Installer executable not found at dist/Installer/RenessPOS_Setup.exe"
              exit 1
          }
          Write-Host "Windows Installer successfully generated: dist/Installer/RenessPOS_Setup.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RenessPOS_Setup
          path: dist/Installer/RenessPOS_Setup.exe
          if-no-files-found: error
