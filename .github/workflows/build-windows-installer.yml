name: Build Windows Installer

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Manual version override (e.g. 1.5, 2.0). Leave blank for auto-increment.'
        required: false
        default: ''

jobs:
  build-installer:
    name: Build Standalone Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      APP_VERSION: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compute Dynamic Build Version
        shell: pwsh
        run: |
          # Automatic Version Incrementing:
          # Uses github.run_number which increments monotonically with every GitHub Actions workflow run.
          # Progression: 1.2 -> 1.3 -> ... -> 1.9 -> 2.0 -> 2.1 ...
          $baseMajor = 1
          $baseMinor = 2
          $runNumber = [int]"${{ github.run_number }}"

          $manualVersion = "${{ inputs.custom_version }}"
          if ($manualVersion -and $manualVersion.Trim() -ne "") {
              $version = $manualVersion.Trim()
              Write-Host "Using manually specified version: $version"
          } else {
              $steps = $runNumber - 1
              $totalMinor = $baseMinor + $steps
              $major = $baseMajor + [math]::Floor($totalMinor / 10)
              $minor = $totalMinor % 10
              $version = "$major.$minor"
              Write-Host "Calculated dynamic version: $version (Workflow Run #$runNumber)"
          }

          $versionInfo = "$version.0.0"
          if ($version.Split('.').Count -ge 3) {
              $versionInfo = "$version.0"
          }

          Write-Host "APP_VERSION=$version"
          Write-Host "VERSION_INFO=$versionInfo"

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_INFO=$versionInfo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Maven Build (Clean and Package)
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $runNum = "${{ github.run_number }}"
          Write-Host "Compiling Reness POS version $ver (build $runNum)..."
          if (Test-Path "settings.xml") {
            mvn clean package "-DskipTests" -B -s settings.xml "-Dapp.version=$ver" "-DbuildNumber=$runNum"
          } else {
            mvn clean package "-DskipTests" -B "-Dapp.version=$ver" "-DbuildNumber=$runNum"
          }

      - name: Distribution and JRE Packaging
        shell: pwsh
        run: |
          Write-Host "Creating packaging directories..."
          New-Item -ItemType Directory -Force -Path "dist/App" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/Installer" | Out-Null

          Write-Host "Locating compiled application JAR in target/..."
          $appJar = Get-ChildItem -Path "target" -Filter "*.jar" | Where-Object { $_.Name -notmatch "original|sources|javadoc" } | Select-Object -First 1
          if (-not $appJar) {
              Write-Error "Could not find compiled application JAR in target/ folder."
              exit 1
          }
          Write-Host "Found compiled JAR: $($appJar.FullName)"
          Write-Host "Renaming and moving to dist/App/renesspos.jar..."
          Copy-Item -Path $appJar.FullName -Destination "dist/App/renesspos.jar" -Force

          # Copy necessary resource directories if they exist in repository
          $dirsToCopy = @("lib", "plugins", "config", "derby-db", "database", "i18n")
          foreach ($dir in $dirsToCopy) {
              if (Test-Path $dir) {
                  Write-Host "Copying repository directory $dir to dist/App/$dir..."
                  Copy-Item -Path $dir -Destination "dist/App/$dir" -Recurse -Force
              }
          }

          # Fallback: check target build directory for assembly outputs if repository folders were empty or generated
          if (-not (Test-Path "dist/App/lib")) {
              if (Test-Path "target/floreantpos-bin/floreantpos/lib") {
                  Write-Host "Copying lib/ from target assembly..."
                  Copy-Item -Path "target/floreantpos-bin/floreantpos/lib" -Destination "dist/App/lib" -Recurse -Force
              } elseif (Test-Path "target/lib") {
                  Write-Host "Copying lib/ from target/lib..."
                  Copy-Item -Path "target/lib" -Destination "dist/App/lib" -Recurse -Force
              }
          }
          if (-not (Test-Path "dist/App/plugins") -and (Test-Path "target/floreantpos-bin/floreantpos/plugins")) {
              Write-Host "Copying plugins/ from target assembly..."
              Copy-Item -Path "target/floreantpos-bin/floreantpos/plugins" -Destination "dist/App/plugins" -Recurse -Force
          }
          if (Test-Path "target/floreantpos-bin/floreantpos/config") {
              Write-Host "Merging config files from target assembly..."
              if (-not (Test-Path "dist/App/config")) {
                  New-Item -ItemType Directory -Force -Path "dist/App/config" | Out-Null
              }
              Copy-Item -Path "target/floreantpos-bin/floreantpos/config/*" -Destination "dist/App/config/" -Recurse -Force
          }
          if (-not (Test-Path "dist/App/database") -and (Test-Path "target/floreantpos-bin/floreantpos/database")) {
              Write-Host "Copying database/ from target assembly..."
              Copy-Item -Path "target/floreantpos-bin/floreantpos/database" -Destination "dist/App/database" -Recurse -Force
          }

          # Remove duplicate floreantpos jar inside lib if present
          if (Test-Path "dist/App/lib") {
              Get-ChildItem -Path "dist/App/lib" -Filter "*floreantpos*.jar" -ErrorAction SilentlyContinue | Remove-Item -Force
          }

          # Copy root properties and icon
          Get-ChildItem -Path "." -Filter "*.properties" -File | ForEach-Object {
              Copy-Item $_.FullName "dist/App/" -Force
          }
          if (Test-Path "resources/icons/icon.ico") {
              Copy-Item "resources/icons/icon.ico" "dist/App/icon.ico" -Force
          } elseif (Test-Path "images/icon.ico") {
              Copy-Item "images/icon.ico" "dist/App/icon.ico" -Force
          }

          # Download portable Adoptium Temurin OpenJDK 17 JRE for Windows x64
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          Write-Host "Downloading portable Adoptium Temurin OpenJDK 17 JRE (Windows x64)..."
          curl.exe -L -f -s -S --retry 3 -o jre.zip $jreUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "jre.zip")) {
              Write-Error "Failed to download JRE from $jreUrl"
              exit 1
          }

          Write-Host "Extracting portable JRE into dist/App/jre..."
          Expand-Archive -Path "jre.zip" -DestinationPath "dist/jre_temp" -Force
          $extractedJre = Get-ChildItem -Directory -Path "dist/jre_temp" | Select-Object -First 1
          if (-not $extractedJre) {
              Write-Error "Could not locate extracted JRE directory"
              exit 1
          }
          Move-Item -Path $extractedJre.FullName -Destination "dist/App/jre" -Force
          Remove-Item -Recurse -Force "dist/jre_temp", "jre.zip"

          if (-not (Test-Path "dist/App/jre/bin/javaw.exe")) {
              Write-Error "javaw.exe not found at dist/App/jre/bin/javaw.exe"
              exit 1
          }
          Write-Host "Portable JRE successfully installed at dist/App/jre"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Inno Setup via Chocolatey..."
              choco install innosetup -y --no-progress
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Generate Inno Setup Script (setup.iss)
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $verInfo = $env:VERSION_INFO

          # Ensure icon is present in dist/App/
          if (-not (Test-Path "dist/App/icon.ico")) {
              if (Test-Path "resources/icons/icon.ico") {
                  Copy-Item "resources/icons/icon.ico" "dist/App/icon.ico" -Force
              }
          }

          $hasIcon = Test-Path "dist/App/icon.ico"
          $setupIconLine = if ($hasIcon) { 'SetupIconFile=dist\App\icon.ico' } else { '' }
          # UninstallDisplayIcon embeds the icon in Windows Settings -> Apps / Installed Apps and Control Panel
          $uninstallIconLine = if ($hasIcon) { 'UninstallDisplayIcon={app}\icon.ico' } else { '' }
          $iconParam = if ($hasIcon) { '; IconFilename: "{app}\icon.ico"' } else { '' }

          $lines = @(
              '[Setup]',
              'AppName=Reness POS',
              "AppVersion=$version",
              'AppPublisher=Abdul Malik Barrie (BAHRI)',
              'AppPublisherURL=mailto:abdulmalikbarrie@gmail.com',
              'AppSupportURL=mailto:abdulmalikbarrie@gmail.com',
              'AppUpdatesURL=mailto:abdulmalikbarrie@gmail.com',
              'DefaultDirName={autopf}\Reness POS',
              'DefaultGroupName=Reness POS',
              'OutputDir=dist\Installer',
              "OutputBaseFilename=RenessPOS_Setup_v$version",
              'Compression=lzma2/ultra64',
              'SolidCompression=yes',
              'ArchitecturesInstallIn64BitMode=x64',
              'DisableProgramGroupPage=yes',
              'PrivilegesRequired=admin',
              'UninstallDisplayName=Reness POS',
              "VersionInfoCompany=Abdul Malik Barrie (BAHRI)",
              "VersionInfoDescription=Reness POS Setup",
              "VersionInfoVersion=$verInfo",
              "VersionInfoCopyright=Copyright (C) 2026 Abdul Malik Barrie (BAHRI)",
              "VersionInfoProductName=Reness POS"
          )

          if ($setupIconLine) {
              $lines += $setupIconLine
          }
          if ($uninstallIconLine) {
              $lines += $uninstallIconLine
          }

          $lines += @(
              '',
              '[Languages]',
              'Name: "english"; MessagesFile: "compiler:Default.isl"',
              '',
              '[Tasks]',
              'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: checkedonce',
              '',
              '[Files]',
              'Source: "dist\App\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs',
              '',
              '[Dirs]',
              'Name: "{app}"; Permissions: users-modify',
              '',
              '[Icons]',
              ('Name: "{group}\Reness POS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-XX:+UseG1GC -XX:+ExplicitGCInvokesConcurrent -Xms256m -Xmx1024m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt.windows=ALL-UNNAMED --add-opens=java.desktop/javax.swing=ALL-UNNAMED --add-opens=java.desktop/javax.swing.plaf.basic=ALL-UNNAMED --add-opens=java.desktop/sun.swing=ALL-UNNAMED --add-opens=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"' + $iconParam),
              ('Name: "{autodesktop}\Reness POS"; Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-XX:+UseG1GC -XX:+ExplicitGCInvokesConcurrent -Xms256m -Xmx1024m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt.windows=ALL-UNNAMED --add-opens=java.desktop/javax.swing=ALL-UNNAMED --add-opens=java.desktop/javax.swing.plaf.basic=ALL-UNNAMED --add-opens=java.desktop/sun.swing=ALL-UNNAMED --add-opens=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Tasks: desktopicon' + $iconParam),
              '',
              '[Run]',
              'Filename: "{app}\jre\bin\javaw.exe"; Parameters: "-XX:+UseG1GC -XX:+ExplicitGCInvokesConcurrent -Xms256m -Xmx1024m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt=ALL-UNNAMED --add-opens=java.desktop/sun.awt.windows=ALL-UNNAMED --add-opens=java.desktop/javax.swing=ALL-UNNAMED --add-opens=java.desktop/javax.swing.plaf.basic=ALL-UNNAMED --add-opens=java.desktop/sun.swing=ALL-UNNAMED --add-opens=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -jar ""{app}\renesspos.jar"""; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,Reness POS}"; Flags: nowait postinstall skipifsilent'
          )

          $lines | Out-File -FilePath "setup.iss" -Encoding utf8
          Write-Host "Generated setup.iss content:"
          Get-Content -Path "setup.iss"

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
              "iscc.exe"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
              Write-Error "Inno Setup Compiler (ISCC.exe) not found"
              exit 1
          }
          Write-Host "Compiling setup.iss using $iscc..."
          & $iscc setup.iss

          $version = $env:APP_VERSION
          $versionedInstaller = "dist/Installer/RenessPOS_Setup_v$version.exe"
          if (Test-Path $versionedInstaller) {
              Write-Host "Windows Installer successfully generated: $versionedInstaller"
              # Create alias RenessPOS_Setup.exe so static links and scripts still work
              Copy-Item -Path $versionedInstaller -Destination "dist/Installer/RenessPOS_Setup.exe" -Force
          } elseif (Test-Path "dist/Installer/RenessPOS_Setup.exe") {
              Write-Host "Windows Installer generated: dist/Installer/RenessPOS_Setup.exe"
          } else {
              Write-Error "Installer executable not found in dist/Installer/"
              exit 1
          }

      - name: Digitally Sign Executable & Installer
        shell: pwsh
        run: |
          Write-Host "Setting up Code Signing Certificate for Abdul Malik Barrie (BAHRI)..."
          if (Test-Path "certs/PublisherCert.pfx") {
              $pfxPass = ConvertTo-SecureString -String "RenessPOS2026!" -Force -AsPlainText
              $cert = Import-PfxCertificate -FilePath "certs/PublisherCert.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $pfxPass
              Write-Host "Imported Publisher Certificate: $($cert.Thumbprint)"
          } else {
              $cert = New-SelfSignedCertificate `
                  -Type CodeSigningCert `
                  -Subject "CN=Abdul Malik Barrie (BAHRI), O=Reness POS, E=abdulmalikbarrie@gmail.com" `
                  -FriendlyName "Abdul Malik Barrie (BAHRI) - Reness POS" `
                  -KeyAlgorithm RSA `
                  -KeyLength 2048 `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -NotAfter (Get-Date).AddYears(10)
          }

          Get-ChildItem -Path "dist/Installer" -Filter "*.exe" | ForEach-Object {
              Write-Host "Digitally signing $($_.FullName)..."
              Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -HashAlgorithm SHA256
          }

          # Copy public certificate and trust script into Installer directory so they are bundled together
          if (Test-Path "AbdulMalikBarrie_Publisher.cer") {
              Copy-Item "AbdulMalikBarrie_Publisher.cer" "dist/Installer/" -Force
          }
          if (Test-Path "Trust_Publisher_Certificate.bat") {
              Copy-Item "Trust_Publisher_Certificate.bat" "dist/Installer/" -Force
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RenessPOS_Setup_v${{ env.APP_VERSION }}
          path: dist/Installer/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Installer/*.exe
            dist/Installer/*.cer
            dist/Installer/*.bat
          name: Reness POS v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
